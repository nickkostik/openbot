[Service]
# Let the Electron main process close its children before systemd stops them.
KillMode=mixed
ExecStartPre=-/usr/bin/sudo -n /usr/bin/env GROKBOT_ASAR_PATCH_BACKUPS=%h/.local/share/openbot/desktop-sidebar-backups /usr/bin/python3 %h/.local/share/openbot/desktop-sidebar-recovery/patch-sidebar-authority.py
